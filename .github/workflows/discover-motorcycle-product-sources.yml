name: Discover Motorcycle Product Sources
on:
  push:
    branches: [fix/motorcycle-media-final-qa]
    paths:
      - scripts/discover-motorcycle-product-sources.mjs
      - .github/workflows/discover-motorcycle-product-sources.yml
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/discover-motorcycle-product-sources.mjs

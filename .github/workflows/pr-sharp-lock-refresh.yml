name: PR Sharp Lock Refresh
on:
  push:
    branches: [fix/discontinued-models-normal-pages]
    paths:
      - .github/workflows/pr-sharp-lock-refresh.yml
      - package.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr-sharp-lock-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Validate dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm run validate:lockfile
      - name: Commit npm generated lockfile to PR
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date'
            exit 0
          fi
          git commit -m 'Refresh lockfile for patched sharp'
          git fetch origin fix/discontinued-models-normal-pages
          git rebase origin/fix/discontinued-models-normal-pages
          git push origin HEAD:fix/discontinued-models-normal-pages

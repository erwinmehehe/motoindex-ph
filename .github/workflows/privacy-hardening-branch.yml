name: Privacy Hardening Branch QA

on:
  push:
    branches: [hardening/data-privacy-ci-v3]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run validate:privacy-hardening
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

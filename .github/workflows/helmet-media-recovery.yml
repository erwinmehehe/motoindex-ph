name: Helmet Media Recovery

on:
  push:
    branches: [fix/media-quality-sweep-sep24]
    paths:
      - scripts/refresh-sourced-product-media.mjs
      - scripts/art-direct-helmet-media.py
      - .github/workflows/helmet-media-recovery.yml
  workflow_dispatch:

concurrency:
  group: helmet-media-recovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/media-quality-sweep-sep24
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore helmet images from recorded sources
        run: node scripts/refresh-sourced-product-media.mjs --types=helmet

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image audit dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize helmet canvases safely
        run: python scripts/art-direct-helmet-media.py

      - name: Audit helmet composition
        run: python scripts/audit-helmet-media-art-direction.py

      - name: Audit product media coverage
        run: node scripts/audit-product-media-coverage.mjs

      - name: Validate media records
        run: npm run validate:media

      - name: Commit recovered helmet media
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet media changes to commit."
            exit 0
          fi
          git commit -m "Recover helmet images from source media"
          git fetch origin fix/media-quality-sweep-sep24
          git rebase origin/fix/media-quality-sweep-sep24
          git push origin HEAD:fix/media-quality-sweep-sep24

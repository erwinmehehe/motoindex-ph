name: Normalize NHK GT Avenger Once

on:
  push:
    branches:
      - seo/helmet-model-gap-closeout-oct5
    paths:
      - .github/workflows/normalize-nhk-gt-avenger-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: seo/helmet-model-gap-closeout-oct5
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize NHK GT Avenger Mark II
        run: python scripts/art-direct-helmet-media.py --only=nhk-gt-avenger-mark-ii

      - name: Verify helmet composition
        run: python scripts/audit-helmet-media-art-direction.py

      - name: Commit normalized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets/nhk-gt-avenger-mark-ii.webp
          if git diff --cached --quiet; then
            echo "No asset change required."
            exit 0
          fi
          git commit -m "Normalize NHK GT Avenger helmet image"
          git push origin HEAD:seo/helmet-model-gap-closeout-oct5

name: Reframe ADV150
on:
  push:
    branches:
      - fix/catalog-white-canvas-audit-sep27
permissions:
  contents: write
jobs:
  reframe:
    if: ${{ !contains(github.event.head_commit.message, '[skip adv150-reframe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/catalog-white-canvas-audit-sep27
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/reframe-adv150.mjs
      - name: Commit reframed ADV150
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/honda-adv-150.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Reframe Honda ADV150 catalog asset [skip adv150-reframe]"
          git push origin HEAD:fix/catalog-white-canvas-audit-sep27

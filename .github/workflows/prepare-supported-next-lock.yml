name: Regenerate patched transitive dependency lockfile

on:
  push:
    branches:
      - fix/supported-next15-cloudflare-20261022
    paths:
      - .github/workflows/prepare-supported-next-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate npm lockfile with patched transitive glob
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/validate-lockfile.mjs
      - name: Show production and full audit results for reviewer
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --audit-level=high || true
      - name: Commit npm-generated lockfile to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): resolve glob CLI advisory in OpenNext transitive tree"
          git push origin HEAD:refs/heads/fix/supported-next15-cloudflare-20261022

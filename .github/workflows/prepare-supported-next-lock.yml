name: Prepare supported Next.js and Cloudflare lockfile

on:
  push:
    branches:
      - fix/supported-next15-cloudflare-20261022
    paths:
      - .github/workflows/prepare-supported-next-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate the pinned dependency lockfile from the npm registry
        run: |
          npm install wrangler@4.151.1 --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install next@15.5.28 @opennextjs/cloudflare@1.20.12 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install eslint-config-next@15.5.28 --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/validate-lockfile.mjs
      - name: Commit pinned versions and npm-generated lockfile to upgrade branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(deps): patch Next.js 15 and OpenNext Cloudflare to supported versions"
          git push origin HEAD:refs/heads/fix/supported-next15-cloudflare-20261022

name: Normalize Flagged Motorcycle Backgrounds
on:
  push:
    branches:
      - fix/catalog-white-canvas-audit-sep27
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip normalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/catalog-white-canvas-audit-sep27
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install background removal dependencies
        run: pip install "rembg[cpu]==2.0.67" pillow
      - name: Normalize flagged motorcycle assets
        run: python scripts/normalize-flagged-backgrounds.py
      - name: Commit normalized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/*.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Normalize flagged motorcycle backgrounds [skip normalize]"
          git push origin HEAD:fix/catalog-white-canvas-audit-sep27

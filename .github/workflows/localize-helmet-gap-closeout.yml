name: One-time helmet gap media sync

on:
  push:
    branches:
      - media/localize-helmet-gap-closeout-oct5

concurrency:
  group: localize-helmet-gap-closeout-oct5
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install image processor
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Localize six helmet images
        run: node scripts/localize-helmet-gap-closeout.mjs

      - name: Validate media records
        run: npm run validate:media

      - name: Run helmet regression tests
        run: npx vitest run tests/helmetExpansion.test.ts

      - name: Commit localized WebPs and remove one-time job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets/gille-astral-pro.webp
          git add public/media/helmets/evo-gsx3000-v2.webp
          git add public/media/helmets/sec-surge.webp
          git add public/media/helmets/sec-dynasty.webp
          git add public/media/helmets/sec-sportgrade-v2.webp
          git add public/media/helmets/sec-ace.webp
          git rm .github/workflows/localize-helmet-gap-closeout.yml scripts/localize-helmet-gap-closeout.mjs
          git commit -m "Localize helmet gap-closeout images [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

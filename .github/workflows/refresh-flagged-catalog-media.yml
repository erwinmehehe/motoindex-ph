name: Refresh Flagged Catalog Media

on:
  push:
    branches:
      - fix/catalog-media-screenshot-batch-sep24

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh corrected motorcycle sources
        run: >
          node scripts/refresh-sourced-product-media.mjs
          --types=motorcycle
          --only=bristol-basilica-125,husqvarna-norden-901,husqvarna-svartpilen-200,royal-enfield-shotgun-650,royal-enfield-super-meteor-650,royal-enfield-bear-650,kymco-sky-town-150
      - name: Validate media
        run: |
          npm run audit:media
          node scripts/audit-motorcycle-media-coverage.mjs
          python3 scripts/audit-motorcycle-media-art-direction.py
      - name: Commit refreshed local derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/bristol-basilica-125.webp
          git add public/media/motorcycles/husqvarna-norden-901.webp
          git add public/media/motorcycles/husqvarna-svartpilen-200.webp
          git add public/media/motorcycles/royal-enfield-shotgun-650.webp
          git add public/media/motorcycles/royal-enfield-super-meteor-650.webp
          git add public/media/motorcycles/royal-enfield-bear-650.webp
          git add public/media/motorcycles/kymco-sky-town-150.webp
          if git diff --cached --quiet; then
            echo "No media changes to commit"
          else
            git commit -m "Refresh screenshot-flagged motorcycle derivatives"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: PR Normalize New Motorcycle Photos
on:
  push:
    branches: [fix/discontinued-models-normal-pages]
    paths:
      - .github/workflows/pr-normalize-motorcycle-photos.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Normalize exact motorcycle source photos non-destructively
        run: |
          python scripts/art-direct-motorcycle-media.py '--only=honda-cb150r,honda-crf250-rally,honda-dio,honda-supra-gtr150,honda-wave125-alpha,honda-zoomer-x,kawasaki-w175,keeway-superlight-200,suzuki-gsx-s150,yamaha-sight,yamaha-vega-force-i'
      - name: Check motorcycle art direction
        run: python scripts/audit-motorcycle-media-art-direction.py
      - name: Commit normalized local motorcycle photos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/motorcycles
          if git diff --cached --quiet; then
            echo 'No motorcycle art-direction changes'
            exit 0
          fi
          git commit -m 'Normalize verified motorcycle product photos to white 1200px canvases'
          git fetch origin fix/discontinued-models-normal-pages
          git rebase origin/fix/discontinued-models-normal-pages
          git push origin HEAD:fix/discontinued-models-normal-pages

name: Motorcycle Image Wave 9 Backfill

on:
  push:
    branches: [fix/motorcycle-images-wave-9]
    paths:
      - scripts/backfill-motorcycle-images-wave9.mjs
      - .github/workflows/motorcycle-image-wave9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/motorcycle-images-wave-9
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Backfill 20 exact model images
        run: node scripts/backfill-motorcycle-images-wave9.mjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image QA dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize only wave 9 images
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location("art", root/"scripts"/"art-direct-motorcycle-media.py")
          art=importlib.util.module_from_spec(spec); spec.loader.exec_module(art)
          ids=["bmw-f-900-gs","bmw-m-1000-rr","bmw-s-1000-r","bmw-s-1000-rr","ducati-panigale-v4","ducati-streetfighter-v4","honda-cb500-hornet-e-clutch","kawasaki-eliminator","kawasaki-ninja-650","kawasaki-ninja-h2","kawasaki-versys-650","kawasaki-vulcan-s","kawasaki-z-h2","kawasaki-z650","ktm-200-duke","ktm-790-duke","triumph-daytona-660","triumph-tiger-sport-660","royal-enfield-super-meteor-650","royal-enfield-classic-650"]
          failures=[]
          for entity_id in ids:
              result=art.process(root/"public"/"media"/"motorcycles"/f"{entity_id}.webp")
              print(result)
              if result.get("status")=="error": failures.append(result)
          if failures: raise SystemExit(1)
          PY

      - name: Validate exact-image coverage
        run: node scripts/audit-motorcycle-media-coverage.mjs

      - name: Validate wave 9 image composition
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location("audit", root/"scripts"/"audit-motorcycle-media-art-direction.py")
          audit=importlib.util.module_from_spec(spec); spec.loader.exec_module(audit)
          ids=["bmw-f-900-gs","bmw-m-1000-rr","bmw-s-1000-r","bmw-s-1000-rr","ducati-panigale-v4","ducati-streetfighter-v4","honda-cb500-hornet-e-clutch","kawasaki-eliminator","kawasaki-ninja-650","kawasaki-ninja-h2","kawasaki-versys-650","kawasaki-vulcan-s","kawasaki-z-h2","kawasaki-z650","ktm-200-duke","ktm-790-duke","triumph-daytona-660","triumph-tiger-sport-660","royal-enfield-super-meteor-650","royal-enfield-classic-650"]
          failures=[]; warnings=[]
          for entity_id in ids:
              bad,warn=audit.inspect(root/"public"/"media"/"motorcycles"/f"{entity_id}.webp")
              failures += bad; warnings += warn
          for warning in warnings: print("WARNING:",warning)
          for failure in failures: print("FAIL:",failure)
          if failures: raise SystemExit(1)
          print(f"Wave 9 composition QA passed for {len(ids)} images.")
          PY

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/media.ts scripts/audit-motorcycle-media-coverage.mjs \
            public/media/motorcycles/bmw-f-900-gs.webp \
            public/media/motorcycles/bmw-m-1000-rr.webp \
            public/media/motorcycles/bmw-s-1000-r.webp \
            public/media/motorcycles/bmw-s-1000-rr.webp \
            public/media/motorcycles/ducati-panigale-v4.webp \
            public/media/motorcycles/ducati-streetfighter-v4.webp \
            public/media/motorcycles/honda-cb500-hornet-e-clutch.webp \
            public/media/motorcycles/kawasaki-eliminator.webp \
            public/media/motorcycles/kawasaki-ninja-650.webp \
            public/media/motorcycles/kawasaki-ninja-h2.webp \
            public/media/motorcycles/kawasaki-versys-650.webp \
            public/media/motorcycles/kawasaki-vulcan-s.webp \
            public/media/motorcycles/kawasaki-z-h2.webp \
            public/media/motorcycles/kawasaki-z650.webp \
            public/media/motorcycles/ktm-200-duke.webp \
            public/media/motorcycles/ktm-790-duke.webp \
            public/media/motorcycles/triumph-daytona-660.webp \
            public/media/motorcycles/triumph-tiger-sport-660.webp \
            public/media/motorcycles/royal-enfield-super-meteor-650.webp \
            public/media/motorcycles/royal-enfield-classic-650.webp
          if git diff --cached --quiet; then
            echo "No generated media changes to commit."
            exit 0
          fi
          git commit -m "Backfill twenty exact motorcycle images"
          git push origin HEAD:fix/motorcycle-images-wave-9

name: Motorcycle Image Wave 9 Backfill

on:
  push:
    branches: [fix/motorcycle-images-wave-9-20-models]
    paths:
      - scripts/backfill-motorcycle-images-wave9.mjs
      - scripts/art-direct-motorcycle-media.py
      - .github/workflows/motorcycle-image-wave9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/motorcycle-images-wave-9-20-models
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Backfill exact model images
        run: node scripts/backfill-motorcycle-images-wave9.mjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install art-direction dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize target images
        env:
          MOTORCYCLE_MEDIA_ONLY: benelli-302s,benelli-leoncino-250,bajaj-dominar-400,bajaj-pulsar-n125,bajaj-pulsar-n160,bajaj-pulsar-ns400z,bajaj-pulsar-rs200,cfmoto-300nk,husqvarna-norden-901,husqvarna-svartpilen-200,benelli-tnt-135,benelli-trk-502,kymco-agility-eco-125i,kymco-dink-r-150,kymco-dink-s-150,kymco-dtx360-300,kymco-sky-town-150,kymco-dollar-150,royal-enfield-shotgun-650,zontes-703rr
        run: python scripts/art-direct-motorcycle-media.py

      - name: Validate exact-image coverage
        run: node scripts/audit-motorcycle-media-coverage.mjs

      - name: Validate image composition
        run: python scripts/audit-motorcycle-media-art-direction.py

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/media.ts scripts/audit-motorcycle-media-coverage.mjs
          for id in benelli-302s benelli-leoncino-250 bajaj-dominar-400 bajaj-pulsar-n125 bajaj-pulsar-n160 bajaj-pulsar-ns400z bajaj-pulsar-rs200 cfmoto-300nk husqvarna-norden-901 husqvarna-svartpilen-200 benelli-tnt-135 benelli-trk-502 kymco-agility-eco-125i kymco-dink-r-150 kymco-dink-s-150 kymco-dtx360-300 kymco-sky-town-150 kymco-dollar-150 royal-enfield-shotgun-650 zontes-703rr; do
            git add "public/media/motorcycles/$id.webp"
          done
          if git diff --cached --quiet; then
            echo "No generated media changes to commit."
            exit 0
          fi
          git commit -m "Backfill twenty exact motorcycle images"
          git push origin HEAD:fix/motorcycle-images-wave-9-20-models

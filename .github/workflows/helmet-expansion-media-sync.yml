name: One-time helmet expansion media sync

on:
  push:
    branches:
      - media/localize-helmet-expansion-oct5
    paths:
      - ".github/workflows/helmet-expansion-media-sync.yml"
      - "scripts/sync-helmet-expansion-media.mjs"

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELMET_IDS: studds-helios,studds-trooper-sport,scorpion-exo-r1-air-carbon,scorpion-exo-adx-2,scorpion-exo-adf-9000-air,scorpion-exo-covert-fx,scorpion-covert-2,nolan-n120-1,nolan-n70-2-x,nolan-n21-visor,nolan-x-804rs-ultra-carbon,nolan-x-552-ultra-carbon,ryo-rf-4sv,ryo-rf-5v,ryo-rf-6v,ryo-ro-4sv,evo-vxr-5000,evo-gt-sport,evo-xt-300-riot-ii,evo-gx-1,evo-dx-7,sec-windstorm-v3,sec-whirlwind,sec-rise-v2,sec-element,oneal-2srs,oneal-3srs,oneal-3srs-ii

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: media/localize-helmet-expansion-oct5
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check opencv-python-headless numpy

      - name: Download exact helmet sources
        run: node scripts/sync-helmet-expansion-media.mjs

      - name: Normalize selected helmets
        run: python scripts/art-direct-helmet-media.py --only="$HELMET_IDS"

      - name: Audit selected helmet media
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import cv2
          import numpy as np

          root=Path("public/media/helmets")
          ids=[x for x in os.environ["HELMET_IDS"].split(",") if x]
          failures=[]
          for entity_id in ids:
              path=root / f"{entity_id}.webp"
              image=cv2.imread(str(path),cv2.IMREAD_COLOR)
              if image is None:
                  failures.append(f"{entity_id}: decode failed")
                  continue
              h,w=image.shape[:2]
              if (w,h)!=(1200,1200):
                  failures.append(f"{entity_id}: expected 1200x1200, got {w}x{h}")
                  continue
              band=12
              border=np.concatenate([
                  image[:band,:,:3].reshape(-1,3),
                  image[-band:,:,:3].reshape(-1,3),
                  image[:,:band,:3].reshape(-1,3),
                  image[:,-band:,:3].reshape(-1,3),
              ])
              white_ratio=float(np.mean(np.all(border>=248,axis=1)))
              if white_ratio<0.995:
                  failures.append(f"{entity_id}: white border {white_ratio:.3%}")
              foreground=np.any(image<245,axis=2)
              ys,xs=np.where(foreground)
              if len(xs)==0:
                  failures.append(f"{entity_id}: no subject")
                  continue
              bw=int(xs.max())-int(xs.min())+1
              bh=int(ys.max())-int(ys.min())+1
              if max(bw/1200,bh/1200)<0.62:
                  failures.append(f"{entity_id}: subject too small {bw/1200:.1%}x{bh/1200:.1%}")
              margins=[int(xs.min()),1200-int(xs.max())-1,int(ys.min()),1200-int(ys.max())-1]
              if min(margins)<28:
                  failures.append(f"{entity_id}: margin below 28px {margins}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Helmet media audit passed for {len(ids)} localized exact-model images.")
          PY

      - name: Commit localized WebPs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets/*.webp
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Localize helmet expansion images [skip ci]"
          git push origin HEAD:media/localize-helmet-expansion-oct5

name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: {}

concurrency:
  group: motoindex-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@motoindexph.com
      ADMIN_ACCESS_MODE: cloudflare
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      ADMIN_ACCESS_EMAILS: ${{ secrets.ADMIN_ACCESS_EMAILS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Production preflight
        run: npm run check:launch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build for Cloudflare (OpenNext)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publish prerendered HTML as static edge assets
        run: node scripts/publish-prerender-assets.mjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production public routes
        run: node scripts/smoke-public-core.mjs
        env:
          BASE_URL: https://motoindexph.com
          EXPECTED_COMMIT_SHA: ${{ github.sha }}

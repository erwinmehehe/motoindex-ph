name: Cloudflare Compatibility

on:
  push:
    branches:
      - cloudflare-workers-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@motoindexph.com
      NEXT_PUBLIC_ANALYTICS_CAPTURE_SEARCH_TERMS: "false"
      PRICE_ALERTS_ENABLED: "false"
      PRICE_ALERT_CRON_CONFIGURED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build for Cloudflare Workers
        run: npm run cf:build

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

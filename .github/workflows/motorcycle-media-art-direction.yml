name: Motorcycle Media QA

on:
  pull_request:
    paths:
      - "public/media/motorcycles/**"
      - "lib/media.ts"
      - "scripts/audit-motorcycle-media-art-direction.py"
      - ".github/workflows/motorcycle-media-art-direction.yml"
  push:
    branches: [main]
    paths:
      - "public/media/motorcycles/**"
      - "lib/media.ts"
      - "scripts/audit-motorcycle-media-art-direction.py"
      - ".github/workflows/motorcycle-media-art-direction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image audit dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Audit motorcycle image composition
        run: python scripts/audit-motorcycle-media-art-direction.py

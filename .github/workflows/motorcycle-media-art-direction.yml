name: Motorcycle Media Art Direction

on:
  push:
    branches: [fix/full-catalog-media-electric-ui]
    paths:
      - scripts/art-direct-motorcycle-media.py
      - scripts/audit-motorcycle-media-art-direction.py
      - .github/workflows/motorcycle-media-art-direction.yml
  workflow_dispatch:

concurrency:
  group: motorcycle-media-art-direction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image processing tools
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Art-direct motorcycle media
        run: python scripts/art-direct-motorcycle-media.py

      - name: Audit white backgrounds and composition
        run: python scripts/audit-motorcycle-media-art-direction.py

      - name: Commit normalized motorcycle media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles
          if git diff --cached --quiet; then
            echo "No motorcycle media changes to commit."
            exit 0
          fi
          git commit -m "Art-direct motorcycle images on white backgrounds"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

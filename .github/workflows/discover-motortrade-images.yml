name: Discover Motortrade image URLs
on:
  push:
    branches: [fix/motorcycle-media-screenshot-batch]
    paths:
      - scripts/discover-motortrade-images.mjs
      - .github/workflows/discover-motortrade-images.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/discover-motortrade-images.mjs

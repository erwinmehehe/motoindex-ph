name: Refresh Screenshot Media Batch 2

on:
  push:
    branches:
      - fix/catalog-media-batch2-sep24

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh weak motorcycle catalog images
        run: >
          node scripts/refresh-sourced-product-media.mjs
          --types=motorcycle
          --only=triumph-speed-twin-900,triumph-tiger-sport-660,triumph-daytona-660,kawasaki-ninja-650,kawasaki-versys-650,kawasaki-vulcan-s,bmw-f-900-gs,bmw-s-1000-rr,bmw-m-1000-rr,bmw-s-1000-r,motorstar-cafe-400
      - name: Discover cleaner exact-model image candidates
        run: node scripts/discover-screenshot-media-candidates.mjs
      - name: Validate refreshed media
        run: |
          node scripts/audit-motorcycle-media-coverage.mjs
      - name: Commit refreshed derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/triumph-speed-twin-900.webp
          git add public/media/motorcycles/triumph-tiger-sport-660.webp
          git add public/media/motorcycles/triumph-daytona-660.webp
          git add public/media/motorcycles/kawasaki-ninja-650.webp
          git add public/media/motorcycles/kawasaki-versys-650.webp
          git add public/media/motorcycles/kawasaki-vulcan-s.webp
          git add public/media/motorcycles/bmw-f-900-gs.webp
          git add public/media/motorcycles/bmw-s-1000-rr.webp
          git add public/media/motorcycles/bmw-m-1000-rr.webp
          git add public/media/motorcycles/bmw-s-1000-r.webp
          git add public/media/motorcycles/motorstar-cafe-400.webp
          if git diff --cached --quiet; then
            echo "No media changes to commit"
          else
            git commit -m "Refresh remaining screenshot-flagged motorcycle media"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

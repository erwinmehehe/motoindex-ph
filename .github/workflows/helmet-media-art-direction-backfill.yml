name: Helmet Media Art Direction Backfill

on:
  push:
    branches: [fix/helmet-media-art-direction]
    paths:
      - scripts/art-direct-helmet-media.py
      - scripts/audit-helmet-media-art-direction.py
      - .github/workflows/helmet-media-art-direction-backfill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art-direct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/helmet-media-art-direction
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Normalize helmet product images
        run: python scripts/art-direct-helmet-media.py
      - name: Audit helmet product images
        run: python scripts/audit-helmet-media-art-direction.py
      - name: Commit normalized helmets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet image changes to commit."
            exit 0
          fi
          git commit -m "Normalize helmet product imagery"
          git push origin HEAD:fix/helmet-media-art-direction

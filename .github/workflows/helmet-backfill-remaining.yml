name: One-time remaining helmet media backfill

on:
  push:
    branches: [media/helmet-backfill-remaining-oct5]
    paths:
      - .github/workflows/helmet-backfill-remaining.yml
  workflow_dispatch:

concurrency:
  group: helmet-backfill-remaining-oct5
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm ci

      - name: Install image tooling
        run: |
          npm install --no-save --package-lock=false sharp@0.35.4
          python -m pip install --disable-pip-version-check --no-cache-dir opencv-python-headless numpy

      - name: Restrict generic backfill to helmets only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/backfill-product-media.mjs")
          s=p.read_text()
          old='const missing = products.filter((item) => !existing.has(`${item.entityType}:${item.id}`));'
          new='const missing = products.filter((item) => item.entityType === "helmet" && !existing.has(`${item.entityType}:${item.id}`));'
          if old not in s:
              raise SystemExit("helmet-only patch target not found")
          p.write_text(s.replace(old,new))
          PY

      - name: Verify media backfill safety
        run: node scripts/validate-media-backfill-safety.mjs

      - name: Backfill remaining helmet images
        run: node scripts/backfill-product-media.mjs

      - name: Audit helmet art direction
        run: python scripts/audit-helmet-media-art-direction.py

      - name: Verify media safety after generation
        run: node scripts/validate-media-backfill-safety.mjs

      - name: Show exact-image coverage
        run: node scripts/audit-product-media-coverage.mjs

      - name: Validate media
        run: npm run validate:media

      - name: Typecheck
        run: npm run typecheck

      - name: Commit localized helmet media
        if: success()
        run: |
          git checkout -- scripts/backfill-product-media.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generatedProductMedia.ts public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet media changes to commit."
            exit 0
          fi
          git commit -m "Backfill remaining verified helmet images"
          git push origin HEAD:${{ github.ref_name }}

name: Fix model page JSX

on:
  push:
    branches:
      - validation/arena-build

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact JSX fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/MotorcycleEntityPage.tsx')
          s = p.read_text()
          old = '        </div>}\n      </section>\n\n      {performance &&'
          new = '        </div>}\n      </section>}\n\n      {performance &&'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MotorcycleEntityPage.tsx
          git commit -m "Fix model page JSX conditional"
          git push origin HEAD:main

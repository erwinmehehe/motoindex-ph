name: Tighten Triumph Catalog Crops

on:
  push:
    branches:
      - fix/catalog-media-batch2-sep24

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tighten white-space around Triumph motorcycles
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          const files = [
            "public/media/motorcycles/triumph-speed-twin-900.webp",
            "public/media/motorcycles/triumph-tiger-sport-660.webp",
            "public/media/motorcycles/triumph-daytona-660.webp",
          ];
          for (const path of files) {
            const trimmed = await sharp(path)
              .trim({ background: "#ffffff", threshold: 10 })
              .toBuffer({ resolveWithObject: true });
            const fitted = await sharp(trimmed.data)
              .resize({ width: 900, height: 900, fit: "inside", withoutEnlargement: false })
              .toBuffer({ resolveWithObject: true });
            const left = Math.floor((1200 - fitted.info.width) / 2);
            const right = 1200 - fitted.info.width - left;
            const top = Math.floor((1200 - fitted.info.height) / 2);
            const bottom = 1200 - fitted.info.height - top;
            await sharp(fitted.data)
              .extend({ top, bottom, left, right, background: "#ffffff" })
              .webp({ quality: 90, effort: 6 })
              .toFile(path + ".tmp");
            await sharp(path + ".tmp").toFile(path);
            await import("node:fs/promises").then(fs => fs.unlink(path + ".tmp"));
          }
          NODE
      - name: Validate composition
        run: |
          python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
          python scripts/audit-motorcycle-media-art-direction.py
      - name: Commit tightened crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/triumph-speed-twin-900.webp
          git add public/media/motorcycles/triumph-tiger-sport-660.webp
          git add public/media/motorcycles/triumph-daytona-660.webp
          if git diff --cached --quiet; then
            echo "No crop changes"
          else
            git commit -m "Tighten Triumph catalog image crops"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

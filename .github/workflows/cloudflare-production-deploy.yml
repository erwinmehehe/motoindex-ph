name: Deploy MotoIndex Production to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: motoindex-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_ACCESS_MODE: cloudflare
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      ADMIN_ACCESS_EMAILS: ${{ secrets.ADMIN_ACCESS_EMAILS }}
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.MOTOINDEX_CONTACT_EMAIL }}
      NEXT_PUBLIC_ANALYTICS_CAPTURE_SEARCH_TERMS: "false"
      PRICE_ALERTS_ENABLED: "false"
      PRICE_ALERT_CRON_CONFIGURED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify production release gates
        run: node scripts/verify-production-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 1)

      - name: Production preflight
        run: npm run check:launch

      - name: Typecheck
        run: npm run typecheck

      - name: Write deployment marker
        run: node scripts/write-build-info.mjs

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Publish prerendered HTML to static edge assets
        run: node scripts/publish-prerender-assets.mjs

      - name: Recheck release gates before deploy
        run: node scripts/verify-production-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy Worker
        run: npm run cf:deploy:built

      - name: Verify production public pages and contact channel
        run: node scripts/smoke-public-core.mjs
        env:
          BASE_URL: https://motoindexph.com
          EXPECTED_COMMIT_SHA: ${{ github.sha }}

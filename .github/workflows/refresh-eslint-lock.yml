name: Refresh ESLint lockfile

on:
  push:
    branches:
      - cleanup/model-route-and-buyer-brief-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/model-route-and-buyer-brief-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for ESLint"
          git push origin HEAD:cleanup/model-route-and-buyer-brief-hardening

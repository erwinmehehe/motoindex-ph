name: Media Coverage Audit

on:
  push:
    branches: [fix/product-image-coverage]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit verified product image coverage
        run: node scripts/audit-product-media-coverage.mjs

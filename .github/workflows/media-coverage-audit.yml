name: Media Coverage Audit

on:
  pull_request:
    branches: [main]
    paths:
      - lib/media.ts
      - lib/generatedProductMedia.ts
      - public/media/**
      - scripts/backfill-product-media.mjs
      - scripts/backfill-ls2-media.mjs
      - scripts/backfill-smk-media.mjs
      - scripts/localize-motorcycle-media.mjs
      - scripts/normalize-generated-product-media.mjs
      - scripts/audit-product-media-coverage.mjs
      - scripts/audit-motorcycle-media-coverage.mjs
      - scripts/art-direct-helmet-media.py
      - scripts/refresh-sourced-product-media.mjs
      - scripts/audit-helmet-media-art-direction.py
      - scripts/validate-media-backfill-safety.mjs
      - components/ProductMedia.tsx
      - app/gear/**
      - package.json
      - package-lock.json
      - .github/workflows/media-coverage-audit.yml
      - .github/workflows/product-image-backfill.yml
      - .github/workflows/security-lock-refresh.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image audit dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Verify non-destructive media pipeline
        run: node scripts/validate-media-backfill-safety.mjs
      - name: Audit verified exact-image coverage
        run: node scripts/audit-product-media-coverage.mjs
      - name: Validate media records
        run: npm run validate:media
      - name: Audit exact motorcycle image coverage
        run: npm run validate:motorcycle-media
      - name: Audit helmet image composition
        run: npm run validate:helmet-media
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Security audit (full dependency tree)
        shell: bash
        run: |
          # CVE-2026-93687 currently affects the latest published braces release.
          # Runtime dependencies remain strictly blocking. For the full dev tree,
          # allow only dependency paths whose underlying high/critical advisory is
          # GHSA-vfj7-8cjw-p6xm; any other high/critical advisory still fails.
          npm audit --audit-level=high --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulnerabilities = report.vulnerabilities || {};
          const exceptionId = "GHSA-vfj7-8cjw-p6xm";

          function advisoryUrls(name, seen = new Set()) {
            if (seen.has(name)) return [];
            seen.add(name);
            const item = vulnerabilities[name];
            if (!item) return [];
            const urls = [];
            for (const via of item.via || []) {
              if (typeof via === "string") {
                urls.push(...advisoryUrls(via, seen));
              } else if (via && typeof via === "object") {
                urls.push(String(via.url || via.title || via.source || ""));
              }
            }
            return urls;
          }

          const blocking = [];
          const excepted = [];
          for (const [name, item] of Object.entries(vulnerabilities)) {
            if (!["high", "critical"].includes(item.severity)) continue;
            const urls = advisoryUrls(name);
            const onlyKnownException = urls.length > 0 && urls.every((value) => value.includes(exceptionId));
            if (onlyKnownException) excepted.push(name);
            else blocking.push(`${name} (${item.severity})`);
          }

          if (blocking.length) {
            console.error("Blocking high/critical dependency findings:");
            for (const item of blocking) console.error(`- ${item}`);
            process.exit(1);
          }

          if (excepted.length) {
            console.log(`::warning title=Temporary dev-dependency exception::${exceptionId} remains visible through: ${excepted.join(", ")}. No fixed braces npm release is currently published.`);
          }
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

name: Media Coverage Audit

on:
  push:
    branches: [fix/product-image-coverage]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit verified exact-image coverage
        run: node scripts/audit-product-media-coverage.mjs
      - name: Validate media records
        run: npm run validate:media
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

name: Motorcycle Media Recovery

on:
  push:
    branches: [fix/media-quality-sweep-sep24]
    paths:
      - scripts/refresh-sourced-product-media.mjs
      - scripts/art-direct-motorcycle-media.py
      - .github/workflows/motorcycle-media-recovery.yml
  workflow_dispatch:

concurrency:
  group: motorcycle-media-recovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/media-quality-sweep-sep24
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore motorcycle images from recorded sources
        run: node scripts/refresh-sourced-product-media.mjs --types=motorcycle

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image audit dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize motorcycle canvases safely
        run: python scripts/art-direct-motorcycle-media.py

      - name: Audit motorcycle composition
        run: python scripts/audit-motorcycle-media-art-direction.py

      - name: Audit exact motorcycle coverage
        run: node scripts/audit-motorcycle-media-coverage.mjs

      - name: Validate media records
        run: npm run validate:media

      - name: Commit recovered motorcycle media
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles
          if git diff --cached --quiet; then
            echo "No motorcycle media changes to commit."
            exit 0
          fi
          git commit -m "Recover motorcycle images from source media"
          git fetch origin fix/media-quality-sweep-sep24
          git rebase origin/fix/media-quality-sweep-sep24
          git push origin HEAD:fix/media-quality-sweep-sep24

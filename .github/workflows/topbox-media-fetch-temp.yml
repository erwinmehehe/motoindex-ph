name: Temporary Topbox Media Fetch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fetch-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - run: python scripts/fetch-topbox-media-temp.py
      - name: Commit normalized top-box media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/top-boxes/*.webp
          git diff --cached --quiet || git commit -m "Add normalized verified top-box product media"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: topbox-media-pack
          path: |
            public/media/top-boxes/shad-sh39.webp
            public/media/top-boxes/shad-sh33.webp
            public/media/top-boxes/shad-sh29.webp
            public/media/top-boxes/coocase-s28-vivo.webp
            public/media/top-boxes/coocase-v28-fusion.webp
            public/media/top-boxes/coocase-v36-wizard.webp
            public/media/top-boxes/coocase-s48-astra.webp
            public/media/top-boxes/coocase-v50-reflex.webp
          if-no-files-found: error

name: Temporary Exact Media Localizer
# rerun: corrected exact-product sources

on:
  push:
    branches:
      - fix/discontinued-models-normal-pages
    paths:
      - .github/workflows/pr-exact-media-localizer.yml

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media normalizer
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Localize selected exact product sources
        run: >
          MEDIA_REFRESH_STRICT=1 node scripts/refresh-sourced-product-media.mjs
          --types=helmet,motorcycle
          --only=hjc-f71,bell-eliminator,agv-k7,agv-tourmodular,alpinestars-supertech-m8,yamaha-yzf-r6,kawasaki-ninja-250sl,suzuki-gsx-r150,suzuki-hayabusa,honda-cbr500r,yamaha-xtz-125

      - name: Audit helmet format
        run: |
          python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
          python scripts/audit-helmet-media-art-direction.py

      - name: Validate media
        run: MEDIA_STRICT_LOCAL=1 npm run validate:media

      - name: Commit normalized media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets public/media/motorcycles
          if git diff --cached --quiet; then
            echo "No localized assets changed."
            exit 0
          fi
          git commit -m "Localize exact helmet and motorcycle images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

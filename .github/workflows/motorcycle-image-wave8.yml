name: Motorcycle Image Wave 8 Backfill

on:
  push:
    branches: [fix/motorcycle-images-wave-8]
    paths:
      - scripts/backfill-motorcycle-images-wave8.mjs
      - scripts/art-direct-motorcycle-media.py
      - .github/workflows/motorcycle-image-wave8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/motorcycle-images-wave-8
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Backfill exact model images
        run: node scripts/backfill-motorcycle-images-wave8.mjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image art-direction dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Normalize white-background catalog composition
        env:
          MOTORCYCLE_MEDIA_ONLY: honda-airblade-160,honda-cbr150r,honda-cbr650r,honda-crf1100l-africa-twin,honda-xl750-transalp,yamaha-lexi-155,yamaha-yzf-r3,yamaha-yzf-r7,kawasaki-z900,yamaha-yzf-r15m
        run: python scripts/art-direct-motorcycle-media.py

      - name: Validate exact-image coverage
        run: node scripts/audit-motorcycle-media-coverage.mjs

      - name: Validate image composition
        run: python scripts/audit-motorcycle-media-art-direction.py

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/media.ts scripts/audit-motorcycle-media-coverage.mjs public/media/motorcycles/honda-airblade-160.webp public/media/motorcycles/honda-cbr150r.webp public/media/motorcycles/honda-cbr650r.webp public/media/motorcycles/honda-crf1100l-africa-twin.webp public/media/motorcycles/honda-xl750-transalp.webp public/media/motorcycles/yamaha-lexi-155.webp public/media/motorcycles/yamaha-yzf-r3.webp public/media/motorcycles/yamaha-yzf-r7.webp public/media/motorcycles/kawasaki-z900.webp public/media/motorcycles/yamaha-yzf-r15m.webp
          if git diff --cached --quiet; then
            echo "No generated media changes to commit."
            exit 0
          fi
          git commit -m "Backfill ten exact motorcycle images"
          git push origin HEAD:fix/motorcycle-images-wave-8

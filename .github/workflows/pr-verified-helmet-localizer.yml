name: Temporary Verified Helmet Localizer

on:
  push:
    branches:
      - fix/discontinued-models-normal-pages
    paths:
      - .github/workflows/pr-verified-helmet-localizer.yml

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false sharp@0.35.4
      - name: Localize exact helmet sources
        run: >
          MEDIA_REFRESH_STRICT=1 node scripts/refresh-sourced-product-media.mjs
          --types=helmet
          --only=hjc-rpha-91,arai-quantic,arai-tour-x5,arai-rx-7v-evo
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Verify helmet art direction
        run: python scripts/audit-helmet-media-art-direction.py
      - name: Validate local media
        run: MEDIA_STRICT_LOCAL=1 npm run validate:media
      - name: Commit localized helmets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet media changes to commit."
            exit 0
          fi
          git commit -m "Localize verified HJC and Arai helmet images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, cloudflare-static-export]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Static export inventory
        if: github.ref == 'refs/heads/cloudflare-static-export'
        shell: bash
        run: |
          echo '=== DYNAMIC EXPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'export const dynamic' app || true
          echo '=== REVALIDATE EXPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'revalidate' app || true
          echo '=== PRISMA / DB IMPORTS IN APP ==='
          grep -RIn --include='*.ts' --include='*.tsx' -E '(@/lib/db|prisma\.)' app || true
          echo '=== API ROUTE HANDLERS ==='
          find app/api -type f \( -name 'route.ts' -o -name 'route.tsx' \) -print 2>/dev/null | sort || true
          echo '=== ADMIN APP FILES ==='
          find app/admin -type f 2>/dev/null | sort || true

      - name: Install dependencies
        run: npm ci

      - name: Release validation
        run: |
          npm run validate:post-audit
          npm run validate:copy-tone
          npm run validate:public-trust
          npm run check:links
          npm run validate:lockfile
          npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

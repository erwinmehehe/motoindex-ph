name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release validation
        run: |
          npm run validate:post-audit
          npm run validate:seo-hardening
          npm run validate:market-hubs
          npm run validate:priority-model-growth
          npm run validate:priority-source-provenance
          npm run validate:intent-depth
          npm run validate:intent-depth-wave2
          npm run validate:intent-depth-wave3
          npm run validate:category-authority-wave4
          npm run validate:semantic-consolidation-wave5
          npm run validate:original-research-wave2
          npm run validate:model-coverage-truth
          npm run validate:demand-backed-availability
          npm run validate:model-intent-split
          npm run validate:model-color-intent-split
          npm run validate:model-top-speed-intent-split
          npm run validate:model-fuel-consumption-intent-split
          npm run validate:model-specs-intent-split
          npm run validate:expressway-hub
          npm run validate:budget-displacement
          npm run validate:copy-tone
          npm run validate:public-trust
          npm run validate:adsense
          node scripts/validate-schema-coverage.mjs
          node scripts/validate-authority-growth.mjs
          node scripts/validate-premium-light.mjs
          node --check scripts/gsc-opportunity-report.mjs
          node scripts/validate-gsc-opportunity.mjs
          npm run check:links
          npm run check:legacy-links
          npm run audit:freshness
          npm run validate:lockfile
          npm run prisma:validate

      - name: Design lint
        run: npm run validate:design

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Performance bundle budget
        run: node scripts/performance-budget.mjs

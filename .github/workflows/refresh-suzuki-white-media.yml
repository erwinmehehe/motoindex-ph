name: Refresh Suzuki White Media
on:
  push:
    branches:
      - fix/suzuki-raider-gixxer-white-media-sep27
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip suzuki-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/suzuki-raider-gixxer-white-media-sep27
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-suzuki-white-media.mjs
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/suzuki-raider-pro.webp public/media/motorcycles/suzuki-gixxer-155.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Normalize Suzuki Raider PRO and Gixxer 155 on white canvas [skip suzuki-refresh]"
          git push origin HEAD:fix/suzuki-raider-gixxer-white-media-sep27

name: Temporary Helmet Backfill

on:
  push:
    branches:
      - fix/discontinued-models-normal-pages
    paths:
      - .github/workflows/pr-helmet-backfill.yml

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install image normalizer
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install helmet audit dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6

      - name: Backfill missing helmet images from exact source pages
        run: node scripts/backfill-product-media.mjs --types=helmet

      - name: Normalize generated media metadata
        run: node scripts/normalize-generated-product-media.mjs

      - name: Normalize only new helmet images that fail art direction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-helmet-media-art-direction.py > /tmp/helmet-audit.txt 2>&1 || true
          cat /tmp/helmet-audit.txt
          ids="$(sed -n 's/^- \([^:]*\)\.webp:.*/\1/p' /tmp/helmet-audit.txt | sort -u | paste -sd, -)"
          if [ -n "$ids" ]; then
            echo "Normalizing failed helmet assets: $ids"
            python scripts/art-direct-helmet-media.py --only="$ids"
          else
            echo "No helmet assets need normalization."
          fi
          python scripts/audit-helmet-media-art-direction.py

      - name: Validate local media records
        run: MEDIA_STRICT_LOCAL=1 npm run validate:media

      - name: Commit helmet media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add lib/generatedProductMedia.ts public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet media changes to commit."
            exit 0
          fi
          git commit -m "Backfill exact helmet product images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

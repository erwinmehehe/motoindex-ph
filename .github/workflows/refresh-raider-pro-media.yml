name: Refresh Raider PRO Media
on:
  push:
    branches:
      - fix/raider-pro-catalog-framing-sep27
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip raider-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/raider-pro-catalog-framing-sep27
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-raider-pro-media.mjs
      - name: Commit normalized Raider PRO asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/suzuki-raider-pro.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Normalize Raider PRO catalog image [skip raider-refresh]"
          git push origin HEAD:fix/raider-pro-catalog-framing-sep27

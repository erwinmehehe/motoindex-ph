name: Motorcycle Next 20 Art Direction
on:
  push:
    branches: [fix/motorcycle-images-next-20]
    paths:
      - scripts/art-direct-motorcycle-media.py
      - .github/workflows/motorcycle-next20-art-direction.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/motorcycle-images-next-20
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install media dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Art direct next twenty
        env:
          MOTORCYCLE_MEDIA_ONLY: cfmoto-300nk,keeway-cafe-racer-152,bajaj-dominar-400,bristol-maxxie-160,bajaj-pulsar-n160,bajaj-pulsar-ns400z,bajaj-pulsar-rs200,benelli-302s,benelli-leoncino-250,benelli-tnt-135,benelli-trk-502,bristol-basilica-125,kawasaki-ninja-zx-25r,royal-enfield-shotgun-650,kymco-agility-eco-125i,kymco-dink-r-150,kymco-dink-s-150,kymco-dollar-150,kymco-sky-town-150,kymco-dtx360-300
        run: python scripts/art-direct-motorcycle-media.py
      - name: Commit normalized targets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/cfmoto-300nk.webp public/media/motorcycles/keeway-cafe-racer-152.webp public/media/motorcycles/bajaj-dominar-400.webp public/media/motorcycles/bristol-maxxie-160.webp public/media/motorcycles/bajaj-pulsar-n160.webp public/media/motorcycles/bajaj-pulsar-ns400z.webp public/media/motorcycles/bajaj-pulsar-rs200.webp public/media/motorcycles/benelli-302s.webp public/media/motorcycles/benelli-leoncino-250.webp public/media/motorcycles/benelli-tnt-135.webp public/media/motorcycles/benelli-trk-502.webp public/media/motorcycles/bristol-basilica-125.webp public/media/motorcycles/kawasaki-ninja-zx-25r.webp public/media/motorcycles/royal-enfield-shotgun-650.webp public/media/motorcycles/kymco-agility-eco-125i.webp public/media/motorcycles/kymco-dink-r-150.webp public/media/motorcycles/kymco-dink-s-150.webp public/media/motorcycles/kymco-dollar-150.webp public/media/motorcycles/kymco-sky-town-150.webp public/media/motorcycles/kymco-dtx360-300.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize next twenty motorcycle images"
          git push origin HEAD:fix/motorcycle-images-next-20

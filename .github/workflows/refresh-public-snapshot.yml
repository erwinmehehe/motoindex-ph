name: Refresh public data snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate public snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generate-public-snapshot.mjs

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/generated/public-db-snapshot.json; then
            echo "Public snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/public-db-snapshot.json
          git commit -m "Refresh public data snapshot"
          git push

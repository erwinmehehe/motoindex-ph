name: Product Image Backfill

on:
  workflow_dispatch:
  push:
    branches: [fix/discontinued-models-normal-pages]
    paths:
      - scripts/data/helmet-image-closeout-20261008.json
      - scripts/localize-helmet-closeout.mjs

concurrency:
  group: product-image-backfill-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected media branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a current non-main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Run Product Image Backfill from a dedicated media/* or fix/* branch, not main."
            exit 1
          fi
          git fetch origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          if [ "$behind" -ne 0 ]; then
            echo "Selected branch is $behind commit(s) behind main. Rebase or recreate it from current main before running media backfill."
            exit 1
          fi
          echo "Backfill branch ${GITHUB_REF_NAME} is current with main."

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install image normalizer
        run: npm install --no-save --package-lock=false sharp@0.35.5

      - name: Verify non-destructive media pipeline
        run: node scripts/validate-media-backfill-safety.mjs

      - name: Localize reviewed exact-model helmet source images
        run: node scripts/localize-helmet-closeout.mjs

      - name: Localize external motorcycle images
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/localize-motorcycle-media.mjs

      - name: Backfill missing gear product images
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/backfill-product-media.mjs

      - name: Backfill missing SMK images from official sources
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/backfill-smk-media.mjs

      - name: Backfill missing LS2 images from official mirror
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/backfill-ls2-media.mjs

      - name: Normalize generated media metadata
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/normalize-generated-product-media.mjs

      - name: Verify non-destructive media pipeline after generation
        run: node scripts/validate-media-backfill-safety.mjs

      - name: Show updated exact-image coverage
        run: node scripts/audit-product-media-coverage.mjs

      - name: Validate exact helmet coverage
        run: npm run validate:helmet-coverage

      - name: Validate media records
        run: MEDIA_STRICT_LOCAL=1 npm run validate:media

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Dependency audit details
        if: always()
        run: npm audit || true

      - name: Commit localized product media
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/media.ts lib/generatedProductMedia.ts scripts/audit-helmet-media-coverage.mjs public/media/motorcycles public/media/helmets public/media/tires public/media/topboxes
          if git diff --cached --quiet; then
            echo "No product media changes to commit."
            exit 0
          fi
          git commit -m "Localize verified product images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

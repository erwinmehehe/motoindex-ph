name: Static Export Audit

on:
  push:
    branches: [cloudflare-static-export]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Static export inventory
        shell: bash
        run: |
          set +e
          echo '=== SEARCH PARAMS IN APP ROUTES ==='
          grep -RIn --include='page.ts' --include='page.tsx' 'searchParams' app || true
          echo '=== REQUEST-TIME NEXT APIS ==='
          grep -RIn --include='*.ts' --include='*.tsx' -E '(^|[^A-Za-z])(headers|cookies)\(' app components lib || true
          echo '=== DYNAMIC EXPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'export const dynamic' app || true
          echo '=== REVALIDATE EXPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'export const revalidate' app || true
          echo '=== PUBLIC PERSISTENT IMPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'persistentSellers\|persistentOffers\|persistentUsedListings\|@/lib/db' app components || true
          echo '=== DB USAGE IN LIB ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'prisma\.\|@/lib/db\|./db' lib || true
          echo '=== API ROUTE HANDLERS ==='
          find app/api -type f \( -name 'route.ts' -o -name 'route.tsx' \) -print 2>/dev/null | sort
          echo '=== MIDDLEWARE ==='
          test -f middleware.ts && echo middleware.ts
          echo '=== ADMIN APP FILES ==='
          find app/admin -type f 2>/dev/null | sort
          echo '=== METADATA ROUTES ==='
          find app -maxdepth 2 -type f \( -name 'sitemap.ts' -o -name 'robots.ts' -o -name 'manifest.ts' \) -print
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

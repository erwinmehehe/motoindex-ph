name: Refresh Flagged White Media
on:
  push:
    branches:
      - fix/white-catalog-assets-sep27
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip media-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/white-catalog-assets-sep27
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-flagged-white-media.mjs
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/honda-cb650r.webp public/media/motorcycles/honda-xl750-transalp.webp public/media/motorcycles/honda-crf1100l-africa-twin.webp public/media/motorcycles/motorstar-cafe-400.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Refresh flagged motorcycle white-background assets [skip media-refresh]"
          git push origin HEAD:fix/white-catalog-assets-sep27

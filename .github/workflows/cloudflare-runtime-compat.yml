name: Cloudflare Runtime Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - components/**
      - lib/**
      - public/**
      - next.config.mjs
      - open-next.config.ts
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare-runtime-compat.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@motoindexph.com
      NEXT_PUBLIC_ANALYTICS_CAPTURE_SEARCH_TERMS: "false"
      PRICE_ALERTS_ENABLED: "false"
      PRICE_ALERT_CRON_CONFIGURED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

name: Cloudflare Runtime Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoindex-runtime-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@motoindexph.com
      NEXT_PUBLIC_ANALYTICS_CAPTURE_SEARCH_TERMS: "false"
      # Synthetic local-worker build exercises approved AdSense CSP code; no live deploy.
      NEXT_PUBLIC_ADSENSE_ENABLED: "true"
      NEXT_PUBLIC_ADSENSE_RELEASE_GATES_APPROVED: "true"
      PRICE_ALERTS_ENABLED: "false"
      PRICE_ALERT_CRON_CONFIGURED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Mirror a default Cloudflare Workers Builds checkout: only Next.js has
      # been built, then Wrangler must create the OpenNext Worker itself.
      - name: Build Next.js (default Git integration behavior)
        run: npm run build

      - name: Validate missing-worker recovery and Worker bundle
        run: |
          test ! -f .open-next/worker.js || (echo 'Expected a fresh OpenNext output for this test' && exit 1)
          npx wrangler deploy --dry-run
          test -s .open-next/worker.js || (echo 'OpenNext Worker not generated' && exit 1)

      - name: Start local Cloudflare Worker
        run: |
          CI=true npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/motoindex-worker.log 2>&1 &
          echo $! > /tmp/motoindex-worker.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/motoindex-worker.log
          exit 1

      - name: Worker route behavior QA
        env:
          BASE_URL: http://127.0.0.1:8787
        run: npm run qa:routes

      - name: Approved-mode AdSense nonce and private-page Worker QA
        env:
          BASE_URL: http://127.0.0.1:8787
        run: node scripts/issue466-adsense-worker-qa.mjs

      - name: Stop local Cloudflare Worker
        if: always()
        run: |
          if [ -f /tmp/motoindex-worker.pid ]; then kill $(cat /tmp/motoindex-worker.pid) || true; fi
          tail -100 /tmp/motoindex-worker.log || true

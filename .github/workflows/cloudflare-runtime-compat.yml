name: Cloudflare Runtime Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - components/**
      - lib/**
      - public/**
      - next.config.mjs
      - open-next.config.ts
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare-runtime-compat.yml
      - scripts/route-behavior-qa.mjs
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://motoindexph.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@motoindexph.com
      NEXT_PUBLIC_ANALYTICS_CAPTURE_SEARCH_TERMS: "false"
      PRICE_ALERTS_ENABLED: "false"
      PRICE_ALERT_CRON_CONFIGURED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Start local Cloudflare Worker
        run: |
          CI=true npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/motoindex-worker.log 2>&1 &
          echo $! > /tmp/motoindex-worker.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/motoindex-worker.log
          exit 1

      - name: Worker route behavior QA
        env:
          BASE_URL: http://127.0.0.1:8787
        run: npm run qa:routes

      - name: Stop local Cloudflare Worker
        if: always()
        run: |
          if [ -f /tmp/motoindex-worker.pid ]; then kill $(cat /tmp/motoindex-worker.pid) || true; fi
          tail -100 /tmp/motoindex-worker.log || true

name: Helmet Image Sync

on:
  push:
    branches: [fix/helmet-image-sync-oct5]
    paths:
      - scripts/localize-helmet-expansion-media.mjs
      - .github/workflows/helmet-image-sync.yml
  workflow_dispatch:

concurrency:
  group: helmet-image-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Sharp
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Localize new helmet images
        run: node scripts/localize-helmet-expansion-media.mjs

      - name: Audit helmet art direction
        run: python scripts/audit-helmet-media-art-direction.py

      - name: Validate media
        run: npm run validate:media

      - name: Typecheck
        run: npm run typecheck

      - name: Commit localized helmet images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/helmets
          if git diff --cached --quiet; then
            echo "No helmet image changes to commit."
            exit 0
          fi
          git commit -m "Localize helmet expansion images"
          git push origin HEAD:${{ github.ref_name }}

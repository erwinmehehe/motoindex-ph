name: Production Smoke

on:
  workflow_run:
    workflows:
      - Production All Pages QA
    types: [completed]
  workflow_dispatch:

concurrency:
  group: motoindex-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify production contract
        env:
          BASE_URL: https://motoindexph.com
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: timeout 240s node scripts/smoke-production.mjs

name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for Cloudflare and verify production
        env:
          BASE_URL: https://motoindexph.com
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Production verification attempt ${attempt}/8 for ${EXPECTED_COMMIT_SHA}"
            if node scripts/smoke-production.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 30
            fi
          done
          echo "Cloudflare production did not converge to the expected release in time."
          exit 1

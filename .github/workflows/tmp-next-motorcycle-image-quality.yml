name: Temporary next motorcycle image quality refresh

on:
  push:
    branches:
      - fix/next-motorcycle-image-quality-20260927
    paths:
      - "lib/media.ts"
      - ".github/workflows/tmp-next-motorcycle-image-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/next-motorcycle-image-quality-20260927
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh priority motorcycle assets
        run: |
          npm run media:sync -- --force --only=honda-navi
          npm run media:sync -- --force --only=husqvarna-svartpilen-401
          npm run media:sync -- --force --only=royal-enfield-guerrilla-450
          npm run media:sync -- --force --only=suzuki-raider-pro
          npm run media:sync -- --force --only=yamaha-aerox-v3
          npm run media:sync -- --force --only=yamaha-nmax-v3
          npm run media:sync -- --force --only=honda-adv-160
          npm run media:sync -- --force --only=honda-click-160

      - name: Validate refreshed motorcycle assets
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const ids = [
            'honda-navi',
            'husqvarna-svartpilen-401',
            'royal-enfield-guerrilla-450',
            'suzuki-raider-pro',
            'yamaha-aerox-v3',
            'yamaha-nmax-v3',
            'honda-adv-160',
            'honda-click-160',
          ];
          (async () => {
            for (const id of ids) {
              const file = `public/media/motorcycles/${id}.webp`;
              if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
              const meta = await sharp(file).metadata();
              if (meta.format !== 'webp' || meta.width !== 1200 || meta.height !== 1200) {
                throw new Error(`${id}: expected 1200x1200 WebP, got ${meta.format} ${meta.width}x${meta.height}`);
              }
              console.log(`ok ${id}: 1200x1200 WebP`);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          npm run validate:media
          npm run validate:motorcycle-media

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/motorcycles/honda-navi.webp \
                  public/media/motorcycles/husqvarna-svartpilen-401.webp \
                  public/media/motorcycles/royal-enfield-guerrilla-450.webp \
                  public/media/motorcycles/suzuki-raider-pro.webp \
                  public/media/motorcycles/yamaha-aerox-v3.webp \
                  public/media/motorcycles/yamaha-nmax-v3.webp \
                  public/media/motorcycles/honda-adv-160.webp \
                  public/media/motorcycles/honda-click-160.webp
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Rebuild priority motorcycle catalog images"
          git push origin HEAD:fix/next-motorcycle-image-quality-20260927

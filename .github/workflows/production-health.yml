name: Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: motoindex-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check critical production routes
        env:
          BASE_URL: https://motoindexph.com
        run: node scripts/check-production-health.mjs

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MotoIndex motorcycle helmet size guide</title>
  <desc id="desc">Original MotoIndex diagram showing head measurement, helmet fit checks and a model-specific size chart workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#444CE7"/>
      <stop offset="1" stop-color="#7A5AF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#444CE7" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="40" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="170" fill="#7A5AF8" opacity="0.08"/>
  <circle cx="140" cy="560" r="210" fill="#12B76A" opacity="0.08"/>
  <g transform="translate(70 62)">
    <rect width="54" height="54" rx="15" fill="url(#accent)"/>
    <path d="M13 39V15h7l7 12 7-12h7v24h-7V26l-7 11-7-11v13z" fill="#fff"/>
    <text x="70" y="37" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">MotoIndex PH</text>
  </g>
  <g transform="translate(70 150)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#444CE7">HELMET FIT GUIDE</text>
    <text x="0" y="58" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#0f172a">Measure first.</text>
    <text x="0" y="116" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#0f172a">Then verify the exact model.</text>
    <text x="0" y="168" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">Head circumference is the starting point, not the final fit decision.</text>
  </g>
  <g transform="translate(715 142)" filter="url(#shadow)">
    <rect width="410" height="360" rx="32" fill="#fff" stroke="#fff"/>
    <ellipse cx="198" cy="141" rx="83" ry="103" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    <path d="M113 129c18-62 52-94 88-94 49 0 79 39 88 94" fill="none" stroke="#444CE7" stroke-width="13" stroke-linecap="round"/>
    <path d="M95 141c33 14 65 20 103 20 41 0 76-7 111-21" fill="none" stroke="#FDB022" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 11"/>
    <circle cx="95" cy="141" r="8" fill="#FDB022"/>
    <circle cx="309" cy="140" r="8" fill="#FDB022"/>
    <path d="M104 244c18 58 54 86 96 86 49 0 86-31 101-92" fill="none" stroke="#12B76A" stroke-width="7" stroke-linecap="round"/>
    <text x="205" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Snug, even pressure</text>
    <text x="205" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">No sharp pressure point</text>
  </g>
  <g transform="translate(70 430)">
    <g>
      <rect width="190" height="92" rx="22" fill="#fff" stroke="#e2e8f0"/>
      <text x="22" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748b">1 · MEASURE</text>
      <text x="22" y="65" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Head circumference</text>
    </g>
    <g transform="translate(210)">
      <rect width="190" height="92" rx="22" fill="#fff" stroke="#e2e8f0"/>
      <text x="22" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748b">2 · MATCH</text>
      <text x="22" y="65" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Exact model chart</text>
    </g>
    <g transform="translate(420)">
      <rect width="190" height="92" rx="22" fill="#fff" stroke="#e2e8f0"/>
      <text x="22" y="36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748b">3 · CHECK</text>
      <text x="22" y="65" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Fit + head shape</text>
    </g>
  </g>
  <text x="70" y="585" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">Original MotoIndex research graphic · motoindexph.com</text>
</svg>
